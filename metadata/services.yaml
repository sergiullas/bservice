        serviceCategory: Migration & Transfer
        serviceDescription: >-
          AWS DMS enables database migration to AWS quickly and securely. The source database
          remains fully operational during migration, minimizing downtime to applications that rely
          on the database. The AWS Database Migration Service can migrate data to and from most
          widely used commercial and open-source databases. The service supports homogenous
          migrations such as Oracle to Oracle, as well as heterogeneous migrations between different
          database platforms, such as Oracle to Amazon Aurora or Microsoft SQL Server to MySQL. One
          can stream data to Amazon Redshift, Amazon DynamoDB, and Amazon S3 from any of the
          supported sources, which are Amazon Aurora, PostgreSQL, MySQL, MariaDB, Oracle Database,
          SAP ASE, SQL Server, IBM DB2 LUW, and MongoDB, enabling consolidation and easy analysis of
          data in a petabyte-scale data warehouse. AWS Database Migration Service can also be used
          for continuous data replication with high availability.
