  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-sns
      title: Amazon SNS
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Messaging
        serviceDescription: >-
          Amazon SNS is a fully managed, reliable pub/sub messaging service that enables
          asynchronous communication between microservices or other distributed system components.
          It allows publishers to send messages to many subscribers including Lambda and SQS using
          one or more topics. While SQS offers persistence and a pull-based model, where a consumer
          polls a queue to process single messages, SNS offers a push-based fire and forget model,
          where multiple consumers subscribe to a topic and each process their own copy of a
          message.
        serviceExternalDoc: https://aws.amazon.com/sns/
        serviceInternalDoc: >-
          https://gitlab-pages.cbp.dhs.gov/cloud/documentation/cim-7266/platforms/development/amazon/sns.html
        provisioningModel: Tier 1
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-sns
        fundingApproach: ECSD pay
        approvalWorkflow: Auto-Approved
        provisioningSLA: Same day
        serviceUseCases:
          - Pub/sub fan-out messaging
          - Fault-tolerant event notification
          - Lambda and SQS event triggers
        serviceOnboardingRequirements:
          - cost_center
          - project
          - environment
          - Topic Names
          - Need FIFO (First-In-First-Out) Topic
          - Need Disable Content-Based Deduplication
          - How many SNS Publishers (Optional)
          - How many SNS Subscribers (Optional)
          - How many Lambda Publishers (Optional)
          - How many Lambda Subscribers (Optional)
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-sqs
      title: Amazon SQS
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Messaging
        serviceDescription: >-
          Amazon SQS is a fully managed message queuing service that decouples and scales
          microservices, distributed systems, and serverless applications. SQS eliminates the
          complexity and overhead associated with managing and operating message-oriented middleware
          and empowers developers to focus on differentiating work. Using SQS, one can send, store,
          and receive messages between software components at any volume, without losing messages or
          requiring other services to be available. SQS offers two types of message queues. Standard
          queues offer maximum throughput, best-effort ordering, and at-least-once delivery. SQS
          FIFO queues are designed to guarantee that messages are processed exactly once, in the
          exact order that they are sent.
        serviceExternalDoc: https://docs.aws.amazon.com/sqs/
        serviceInternalDoc: ./platforms/development/amazon/sqs
        provisioningModel: Tier 1
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-sqs
        fundingApproach: ECSD pay
        approvalWorkflow: Auto-Approved
        provisioningSLA: Same day
        serviceUseCases:
          - Decoupled microservice messaging
          - Work queue processing
          - Dead-letter queue handling for failed messages
        serviceOnboardingRequirements:
          - cost-center
          - project
          - environment
          - queue-name
          - suffix (optional)
          - queue-type (standard or fifo)
          - fifo-content-based-deduplication (true or false, for fifo queues only)
          - message-retention-period (e.g., 4 days)
          - visibility-timeout (in seconds)
          - receive-message-wait-time (in seconds)
          - deadletter-queue
          - dlq-maximum-receives (number of receives before moving to dlq)
