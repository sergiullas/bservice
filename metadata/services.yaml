services:
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-athena
      title: Amazon Athena
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Analytics
        serviceDescription: >-
          Amazon Athena is an interactive query service that makes it easy to analyze data in Amazon
          S3 using standard SQL. Athena is serverless, so there is no infrastructure to manage, and
          you pay only for the queries that you run.
        serviceExternalDoc: https://docs.aws.amazon.com/athena/
        serviceInternalDoc: ./platforms/development/amazon/athena
        provisioningModel: Tier 1
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-athena
        fundingApproach: ECSD pay
        approvalWorkflow: Auto-Approved
        provisioningSLA: Same day
        serviceUseCases:
          - Ad hoc SQL analysis over S3 data
          - Serverless querying for data lake workloads
          - Log and clickstream analysis
        serviceOnboardingRequirements:
          - cost-center
          - project
          - environment
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-aurora-serverless
      title: Amazon Aurora Serverless
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Database
        serviceDescription: >-
          Amazon Aurora Serverless is an on demand, autoscaling configuration for Amazon Aurora, a
          relational database service compatible with MySQL and PostgreSQL. It automatically adjusts
          database capacity based on workload requirements, eliminating the need for manual
          provisioning and management of database servers.
        serviceExternalDoc: https://aws.amazon.com/rds/aurora/serverless/
        serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/platforms/development/amazon/rds.html#aurora-serverless
        provisioningModel: Tier 2
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-aurora-serverless
        fundingApproach: Funding recouped
        approvalWorkflow: Manager Approval
        provisioningSLA: 3 business days
        serviceUseCases:
          - Variable and intermittent workload databases
          - Dev and test database capacity
          - Auto-scaling relational workloads
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-bedrock
      title: Amazon Bedrock
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: AI & Machine Learning
        serviceDescription: >-
          Amazon Bedrock is a fully managed service from Amazon Web Services (AWS) that provides
          access to a variety of powerful foundation models (FMs) from leading AI companies,
          including Anthropic, Meta, and Cohere, as well as Amazon's own Titan family of models. It
          is designed to simplify the development of generative AI applications without the need to
          manage infrastructure.
        serviceExternalDoc: https://docs.aws.amazon.com/bedrock/
        serviceInternalDoc: ./platforms/development/amazon/bedrock
        provisioningModel: Tier 3
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        serviceLimitations: Not approved for PII or PHI workloads.
        fedRampStatus: FedRAMP Ready
        trmStatus: Restricted
        trmRestrictionOwner: CIM AI Platform Team
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-bedrock
        fundingApproach: Funding recouped
        approvalWorkflow: Multi-Level Approval
        provisioningSLA: 10 business days
        serviceUseCases:
          - Content generation and summarization
          - Document analysis and extraction
          - Code generation assistance
          - Conversational AI prototyping
        serviceOnboardingRequirements:
          - cost_center
          - project
          - environment
          - TRM Link to the requested Large Language Model (LLM)
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-connect
      title: Amazon Connect
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Customer Engagement
        serviceDescription: >-
          A self-service, cloud-based contact center service that scales to support any size
          business.
        serviceExternalDoc: https://docs.aws.amazon.com/connect/
        serviceInternalDoc: ./governance/request-access#amazon-connect
        provisioningModel: Tier 3
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP In Process
        trmStatus: Restricted
        trmRestrictionOwner: CIM Application Platform Team
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-connect
        fundingApproach: Funding recouped
        approvalWorkflow: Security Review
        provisioningSLA: 10 business days
        serviceUseCases:
          - Cloud-based contact center
          - Customer support call routing
          - Interactive voice response (IVR) flows
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-documentdb
      title: Amazon DocumentDB
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Database
        serviceDescription: >-
          Amazon DocumentDB (with MongoDB compatibility) is a database service that is purpose-built
          for JSON data management at scale, fully managed and integrated with AWS, and
          enterprise-ready with high durability. Amazon DocumentDB is designed to give you the
          scalability and durability you need when operating mission-critical MongoDB workloads.
          Storage scales automatically up to 64TiB without any impact to your application. It
          supports millions of requests per second with up to 15 low latency read replicas in
          minutes, without any application downtime, regardless of the size of your data.
        serviceExternalDoc: https://docs.aws.amazon.com/documentdb/
        serviceInternalDoc: ./platforms/development/amazon/docudb
        provisioningModel: Tier 2
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-documentdb
        fundingApproach: ECSD pay
        approvalWorkflow: Manager Approval
        provisioningSLA: 3 business days
        serviceUseCases:
          - JSON document workloads
          - MongoDB-compatible application backends
          - Content management data stores
        serviceOnboardingRequirements:
          - cost_center
          - project
          - environment
          - version
          - instance_types
          - Instance_count
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-dynamodb
      title: Amazon DynamoDB
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Database
        serviceDescription: >-
          Amazon DynamoDB is a fully managed proprietary NoSQL database service that is offered by
          Amazon.com as part of the Amazon Web Services portfolio. DynamoDB exposes a similar data
          model and derives its name from Dynamo, but has a different underlying implementation.
          Dynamo had a multi-master design requiring the client to resolve version conflicts, and
          DynamoDB uses synchronous replication across multiple datacenters for high durability and
          availability.
        serviceExternalDoc: https://docs.aws.amazon.com/dynamodb/
        serviceInternalDoc: ./platforms/development/amazon/dynamodb
        provisioningModel: Tier 1
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-dynamodb
        fundingApproach: ECSD pay
        approvalWorkflow: Auto-Approved
        provisioningSLA: Same day
        serviceUseCases:
          - Session state management
          - Real-time leaderboards
          - IoT device telemetry
          - High-throughput key-value lookups
        serviceOnboardingRequirements:
          - cost_center
          - project
          - environment
          - table_name (Optional)
          - read_capacity
          - write_capacity
          - hash_key
          - range_key (Optional)
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-ec2
      title: Amazon EC2
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Compute
        serviceDescription: >-
          Amazon EC2 forms a central part of the AWS cloud-computing platform, Amazon Web Services
          (AWS), by allowing users to rent virtual computers on which to run their own computer
          applications. EC2 encourages scalable deployment of applications by providing a web
          service through which a user can boot an Amazon Machine Image (AMI) to configure a virtual
          machine, which Amazon calls an "instance", containing any software desired. A user can
          create, launch, and terminate server-instances as needed, paying by the hour for active
          servers – hence the term "elastic". EC2 provides users with control over the geographical
          location of instances that allows for latency optimization and high levels of redundancy.
        serviceExternalDoc: https://docs.aws.amazon.com/ec2/
        serviceInternalDoc: ./platforms/iaas/ec2
        provisioningModel: Tier 1
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-ec2
        fundingApproach: ECSD pay
        approvalWorkflow: Auto-Approved
        provisioningSLA: Same day
        serviceUseCases:
          - Web application hosting
          - Batch processing workloads
          - Development and test environments
          - High-performance computing
        serviceOnboardingRequirements:
          - cost-center
          - project
          - environment
          - quantity
          - operating-system (linux or windows)
          - instance-type
          - storage-size
          - tier-structure (for linux)
          - subnet-id
          - security-group-ids
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-eks
      title: Amazon EKS
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Container Platform
        serviceDescription: >-
          Amazon EKS (Elastic Kubernetes Service) is a fully managed service that allows you to run
          Kubernetes on AWS without needing to install, operate, or maintain your own Kubernetes
          control plane. Because it is certified Kubernetes-conformant, any application running on
          standard upstream Kubernetes can easily migrate to Amazon EKS without any code changes.
        serviceExternalDoc: https://docs.aws.amazon.com/eks/
        serviceInternalDoc: ./platforms/cicd/eks/index
        provisioningModel: Tier 3
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Restricted
        trmRestrictionOwner: CIM Container Platform Team
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-eks
        fundingApproach: Funding recouped
        approvalWorkflow: Architecture Review
        provisioningSLA: 10 business days
        serviceUseCases:
          - Containerized microservices
          - CI/CD workload hosting
          - Multi-tenant Kubernetes workloads
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-elastic-block-store
      title: Amazon Elastic Block Store
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Storage
        serviceDescription: >-
          Amazon Elastic Block Store (EBS) provides raw, block-level storage volumes for use with
          Amazon EC2 instances. It functions like a virtual hard drive, enabling you to install
          operating systems, run databases, or store persistent files that remain intact even when
          an EC2 instance is stopped or restarted.
        serviceExternalDoc: https://aws.amazon.com/ebs/
        serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/
        provisioningModel: Tier 1
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-elastic-block-store
        fundingApproach: ECSD pay
        approvalWorkflow: Auto-Approved
        provisioningSLA: Same day
        serviceUseCases:
          - Persistent EC2 instance storage
          - Database volume storage
          - Snapshot-based disaster recovery
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-elasticache
      title: Amazon ElastiCache
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Database
        serviceDescription: >-
          Amazon ElastiCache offers fully managed Redis and Memcached. Seamlessly deploy, operate,
          and scale popular open source compatible in-memory data stores. Build data-intensive apps
          or improve the performance of your existing apps by retrieving data from high throughput
          and low latency in-memory data stores.
        serviceExternalDoc: https://docs.aws.amazon.com/ElastiCache/
        serviceInternalDoc: ./platforms/development/amazon/elasticache
        provisioningModel: Tier 2
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-elasticache
        fundingApproach: ECSD pay
        approvalWorkflow: Manager Approval
        provisioningSLA: 3 business days
        serviceUseCases:
          - Application caching layers
          - Session store for web applications
          - Real-time leaderboard and counters
        serviceOnboardingRequirements:
          - cost-center
          - project
          - environment
          - mode
          - node-type
          - nodes
          - encryption-in-transit
          - encryption-at-rest
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-end-user-messaging
      title: Amazon End User Messaging
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Messaging
        serviceDescription: >-
          AWS End User Messaging empowers developers to integrate scalable and reliable messaging
          capabilities into their applications. Whether it is time-sensitive alerts, one-time
          passwords, or two-way communications, AWS End User Messaging helps ensure your messages
          reach their local or global destination across channels like SMS, MMS. AWS End User
          Messaging helps unlock the full potential of your messaging strategy by connecting your
          applications directly to your end-users across the channels they use and trust.
        serviceExternalDoc: https://aws.amazon.com/sns/
        serviceInternalDoc: ./platforms/development/amazon/eum
        provisioningModel: Tier 3
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        serviceLimitations: SMS/MMS campaign registration must be approved before send access is granted.
        fedRampStatus: FedRAMP In Process
        trmStatus: Restricted
        trmRestrictionOwner: CIM Integration Platform Team
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-end-user-messaging
        fundingApproach: Funding recouped
        approvalWorkflow: Security Review
        provisioningSLA: 10 business days
        serviceUseCases:
          - Time-sensitive SMS/MMS alerts
          - One-time passcode delivery
          - Two-way customer text messaging
        serviceOnboardingRequirements:
          - cost_center
          - project
          - environment
          - >-
            Estimated Monthly Message Volume - Optional (Less than 500 / Greater than 500 but less
            than 5000 / Greater than 5000)
          - Destination (Local or International)
          - Two-way SMS Messaging (Yes or No)
          - >-
            Originator Type (Long Code - Supports only voice messaging.; Short Code - Supports SMS
            and MMS messaging.; Toll-Free – Supports SMS, MMS, and voice messaging.; 10DLC -
            Supports SMS, MMS, and voice messaging.)
          - >-
            Registration Information (Please note it will take several weeks for registration to
            complete) (Enter Campaign Description (Identify who the sender is; Identify who the
            recipient is; Why messages are being sent to the intended recipient.); Company's SMS
            Terms & Conditions (URL or File, less than 500KB))
          - Company Privacy policy URL (Example - https://www.dhs.gov/topics/privacy)
          - >-
            Campaign opt-in workflow (Explain end-to-end how a user explicitly consents to receive
            text messages.)
          - >-
            Opt-in confirmation message (Provide the message sent to recipients confirming with them
            that they've opted in to your service.)
          - Help message (Provide the message sent to end-users when they send the 'HELP' keyword.)
          - >-
            Stop message (Provide the message sent to end-users when they send the opt-out keywords
            such as 'STOP'.)
          - >-
            Message Type - Transactional or Promotional (Needs to align with your campaign use case,
            if it's misaligned your registration will be denied.)
          - Use case – Details about how this campaign will be used for sending SMS messages.
          - >-
            Subscriber opt-in (Yes or No, Yes acknowledges you are required to collect and process
            consumer opt-ins.)
          - >-
            Subscriber opt-out (Yes or No, Yes acknowledges you are required to collect and process
            consumer opt-outs.)
          - >-
            Subscriber help (Yes or No, Yes confirms you've implemented automated 'HELP' replies
            with sender contact info.)
          - >-
            Message Sample (At least one sample is required, minimum 20 characters, limited to 1024
            characters. Include a sample message for each message you plan on sending from this
            campaign, up to 5 samples.)
          - MMS Sample – Optional with File attachment
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-groundtruth
      title: Amazon Groundtruth
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: AI & Machine Learning
        serviceDescription: >-
          Amazon Ground Truth enables users with the ability to label image and text datasets to
          provide the correct metadata for Machine Learning (ML) model training. Auto-labeling is a
          ML enabled Ground Truth feature available to automatically complete labeling operations on
          a dataset while using only part of the dataset that has been already manually labeled
          within Ground Truth.
        serviceExternalDoc: https://aws.amazon.com/sagemaker/groundtruth/
        serviceInternalDoc: ./platforms/development/amazon/sagemaker-groundtruth
        provisioningModel: Tier 3
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Ready
        trmStatus: Restricted
        trmRestrictionOwner: CIM AI Platform Team
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-groundtruth
        fundingApproach: Funding recouped
        approvalWorkflow: Multi-Level Approval
        provisioningSLA: 10 business days
        serviceUseCases:
          - Training dataset labeling
          - Human-in-the-loop annotation
          - Auto-labeling for ML pipelines
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-guard-duty
      title: Amazon Guard Duty
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Security Scanning
        serviceDescription: >-
          Amazon GuardDuty is a managed threat detection service that continuously monitors your AWS
          environment for malicious activity, unauthorized behavior, and security compromises. It
          uses machine learning, anomaly detection, and integrated threat intelligence to analyze
          data across multiple AWS sources.
        serviceExternalDoc: https://aws.amazon.com/guardduty/
        serviceInternalDoc: >-
          https://cloud-docs.cbp.dhs.gov/governance/compliancefaq.html#threat-monitoring-and-compliance-standards
        provisioningModel: Tier 1
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-guard-duty
        fundingApproach: ECSD pay
        approvalWorkflow: Auto-Approved
        provisioningSLA: Same day
        serviceUseCases:
          - Continuous threat detection
          - Anomaly and unauthorized-behavior monitoring
          - Automated security finding triage
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-keyspaces
      title: Amazon Keyspaces
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Database
        serviceDescription: >-
          Amazon Keyspaces (for Apache Cassandra) is a scalable, highly available, and managed
          Apache Cassandra–compatible database service. With Amazon Keyspaces, you can run Cassandra
          workloads on AWS using the same Cassandra application code and developer tools that you
          use today. It is serverless and managed by AWS and does not require you to provision,
          patch, or manage servers, and does not require you to install, maintain, or operate
          software. The service can automatically scale tables up and down in response to
          application traffic. Data is encrypted by default and Amazon Keyspaces backs up table data
          continuously using point-in-time recovery. Keyspaces gives you the performance,
          elasticity, and enterprise features you need to operate business-critical Cassandra
          workloads at scale.
        serviceExternalDoc: https://docs.aws.amazon.com/keyspaces/
        serviceInternalDoc: ./platforms/development/amazon/keyspaces
        provisioningModel: Tier 2
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-keyspaces
        fundingApproach: ECSD pay
        approvalWorkflow: Manager Approval
        provisioningSLA: 3 business days
        serviceUseCases:
          - Cassandra-compatible workload migration
          - High-throughput wide-column data
          - IoT and time-series data storage
        serviceOnboardingRequirements:
          - cost_center
          - project
          - environment
          - Keyspace suffix (optional)
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-kinesis-data-streams
      title: Amazon Kinesis Data Streams
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Messaging
        serviceDescription: >-
          Amazon Kinesis Data Streams makes it easy to collect, process, and analyze real-time,
          streaming data to get timely insights and react quickly to new information. Amazon Kinesis
          offers key capabilities to cost-effectively process streaming data at any scale, along
          with the flexibility to choose the tools that best suit the requirements of an
          application. With Amazon Kinesis, one can ingest real-time data such as video, audio,
          application logs, website clickstreams, and IoT telemetry data for machine learning,
          analytics, and other applications. Amazon Kinesis enables one to process and analyze data
          as it arrives and respond instantly instead of having to wait until all data is collected
          before the processing can begin.
        serviceExternalDoc: https://docs.aws.amazon.com/streams/
        serviceInternalDoc: ./platforms/development/amazon/kinesis
        provisioningModel: Tier 2
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-kinesis-data-streams
        fundingApproach: Funding recouped
        approvalWorkflow: Manager Approval
        provisioningSLA: 3 business days
        serviceUseCases:
          - Real-time clickstream analytics
          - IoT telemetry ingestion
          - Streaming ETL pipelines
        serviceOnboardingRequirements:
          - cost_center
          - project
          - environment
          - Quantity
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-mq
      title: Amazon MQ
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Messaging
        serviceDescription: >-
          Amazon MQ is a managed message broker service for Apache ActiveMQ and RabbitMQ that makes
          it easy to set up and operate message brokers on AWS. Amazon MQ reduces your operational
          responsibilities by managing the provisioning, setup, and maintenance of message brokers
          for you. Because Amazon MQ connects to your current applications with industry-standard
          APIs and protocols, you can easily migrate to AWS without having to rewrite code.
        serviceExternalDoc: https://docs.aws.amazon.com/amazon-mq/
        serviceInternalDoc: ./platforms/development/amazon/mq
        provisioningModel: Tier 2
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-mq
        fundingApproach: Funding recouped
        approvalWorkflow: Manager Approval
        provisioningSLA: 3 business days
        serviceUseCases:
          - Legacy ActiveMQ/RabbitMQ migrations
          - Protocol-standard message brokering
          - Enterprise application integration
        serviceOnboardingRequirements:
          - cost_center
          - project
          - environment
          - Quantity
          - Engine Type (ActiveMQ or RabbitMQ)
          - >-
            Deployment mode (SINGLE_INSTANCE [default], ACTIVE_STANDBY_MULTI_AZ, or
            CLUSTER_MULTI_AZ)
          - Broker instance types (see AWS documentation for supported instance types)
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-msk
      title: Amazon MSK
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Streaming
        serviceDescription: >-
          AWS MSK (Managed Streaming for Apache Kafka) is a fully managed service that simplifies
          running Apache Kafka applications on AWS. It handles infrastructure tasks like
          provisioning, scaling, patching, and multi-AZ replication, letting you build real-time
          data pipelines and streaming applications without managing the underlying servers.
        serviceExternalDoc: https://docs.aws.amazon.com/msk/
        serviceInternalDoc: ./platforms/development/amazon/msk
        provisioningModel: Tier 2
        cloudAto:
          - CACE
        serviceOwner: Natasha Romanoff
        fedRampStatus: FedRAMP Certified
        trmStatus: Permitted
        trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-msk
        fundingApproach: Funding recouped
        approvalWorkflow: Manager Approval
        provisioningSLA: 5 business days
        serviceUseCases:
          - Real-time streaming data pipelines
          - Event-driven microservice communication
          - Kafka workload migration to managed infrastructure
        serviceOnboardingRequirements:
          - cost-center
          - project
          - environment
          - >-
            number-of-nodes (non-prod defaults to a 3 node cluster unless requested otherwise; prod
            has a minimum of 6 nodes, in increments of 3)
          - >-
            For PROD, the Amazon EC2 instance type to use for brokers (kafka.m5.large,
            kafka.m5.xlarge, kafka.m5.2xlarge, kafka.m5.4xlarge, kafka.m5.12xlarge, or
            kafka.m5.24xlarge)
  - apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: amazon-neptune
      title: Amazon Neptune
    spec:
      type: service-offering
      profile:
        cloudProvider: AWS
        serviceCategory: Database
        serviceDescription: >-
          Amazon Neptune is a service that includes a graph database engine, graph analytics
          database engine, graph machine learning (ML), and visualization tools, which can be used
          individually or together. The Neptune service makes it easy to work with graph data on
          AWS.
