apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: azure-frontdoor
  title: Azure Front Door
spec:
  type: service-offering
  lifecycle: production
  profile:
    cloudProvider: Azure
    serviceCategory: Networking
    serviceDescription: Global load balancer and CDN with built-in WAF, SSL offload, and intelligent traffic routing.
    serviceExternalDoc: https://learn.microsoft.com/en-us/azure/
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/
    provisioningModel: Tier 2
    cloudAto:
      - CMAA
    serviceOwner: Wanda Maximoff
    serviceLimitations: WAF rule customization requires security team sign-off.
    fedRampStatus: FedRAMP Certified
    trmStatus: Prohibited
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#azure-frontdoor
    fundingApproach: Funding recouped
    approvalWorkflow: Security Review
    provisioningSLA: 5 business days
    serviceUseCases:
      - Global load balancing
      - Web application firewall
      - SSL offloading
      - Blue-green and canary deployments
