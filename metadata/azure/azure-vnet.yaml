apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: azure-vnet
  title: Azure Virtual Network
spec:
  type: service-offering
  lifecycle: production
  profile:
    cloudProvider: Azure
    serviceCategory: Networking
    serviceDescription: Provision private networks and securely connect Azure resources with full control over IP addressing.
    serviceExternalDoc: https://learn.microsoft.com/en-us/azure/
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/
    provisioningModel: Tier 2
    cloudAto:
      - CMAA
    serviceOwner: Wanda Maximoff
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#azure-vnet
    fundingApproach: ECSD pay
    approvalWorkflow: Manager Approval
    provisioningSLA: 2 business days
    serviceUseCases:
      - Private workload isolation
      - Hybrid network connectivity
      - Application gateway integration
      - Subnet-level access controls
