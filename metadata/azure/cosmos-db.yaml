apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: cosmos-db
  title: Azure Cosmos DB
spec:
  type: service-offering
  lifecycle: production
  profile:
    cloudProvider: Azure
    serviceCategory: Database
    serviceDescription: Globally distributed, multi-model database service for any scale with guaranteed low latency.
    serviceExternalDoc: https://learn.microsoft.com/en-us/azure/
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/
    provisioningModel: Tier 2
    cloudAto:
      - CMAA
    serviceOwner: Wanda Maximoff
    serviceLimitations: Multi-region writes require architecture review.
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#cosmos-db
    fundingApproach: Funding recouped
    approvalWorkflow: Manager Approval
    provisioningSLA: 3 business days
    serviceUseCases:
      - Globally distributed applications
      - Real-time personalization
      - Multi-region writes
      - Catalog and inventory systems
