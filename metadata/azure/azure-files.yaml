apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: azure-files
  title: Azure Files
spec:
  type: service-offering
  lifecycle: production
  profile:
    cloudProvider: Azure
    serviceCategory: Storage
    serviceDescription: Fully managed cloud file shares accessible via SMB and NFS protocols for lift-and-shift scenarios.
    serviceExternalDoc: https://learn.microsoft.com/en-us/azure/
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/
    provisioningModel: Tier 1
    cloudAto:
      - CMAA
    serviceOwner: Wanda Maximoff
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#azure-files
    fundingApproach: ECSD pay
    approvalWorkflow: Auto-Approved
    provisioningSLA: Same day
    serviceUseCases:
      - Shared network drive replacement
      - Application config file storage
      - Legacy app lift-and-shift
      - Azure VM shared storage
