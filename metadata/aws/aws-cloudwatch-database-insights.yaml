apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: aws-cloudwatch-database-insights
  title: AWS CloudWatch Database Insights
spec:
  type: service-offering
  lifecycle: production
  profile:
    cloudProvider: AWS
    serviceCategory: Monitoring & Management
    serviceDescription: Amazon CloudWatch Database Insights is a comprehensive, unified observability solution for monitoring and troubleshooting Amazon RDS and Aurora databases. It provides a single dashboard for fleet-level health, automatic telemetry collection, and AI-powered diagnostics to pinpoint bottlenecks in relational databases like PostgreSQL, MySQL, Oracle, and SQL Server.
    serviceExternalDoc: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Database-Insights.html
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/platforms/development/amazon/rds.html#aws-database-insights-di
    provisioningModel: Tier 2
    cloudAto:
      - CACE
    serviceOwner: Natasha Romanoff
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#aws-cloudwatch-database-insights
    fundingApproach: Funding recouped
    approvalWorkflow: Manager Approval
    provisioningSLA: 3 business days
    serviceUseCases:
      - Fleet-level RDS/Aurora health monitoring
      - AI-assisted database bottleneck diagnosis
      - Unified database performance dashboards
