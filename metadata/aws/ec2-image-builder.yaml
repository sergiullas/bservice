apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ec2-image-builder
  title: EC2 Image Builder
spec:
  type: service-offering
  profile:
    cloudProvider: AWS
    serviceCategory: Compute
    serviceDescription: >-
      EC2 Image Builder is a fully managed AWS service that helps the user to automate the creation,
      management, and deployment of customized, secure, and up-to-date server images. The user can
      use the AWS Management Console, AWS Command Line Interface, or APIs to create custom images in
      their AWS account. The EC2 Image builder increases productivity and reduces operations for
      building compliant and up-to-date images. It increases service up time and raises the security
      bar for deployments.
    serviceExternalDoc: https://docs.aws.amazon.com/imagebuilder/
    serviceInternalDoc: ./platforms/development/amazon/ec2-image-builder
    provisioningModel: Tier 2
    cloudAto:
      - CACE
    serviceOwner: Natasha Romanoff
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#ec2-image-builder
    fundingApproach: ECSD pay
    approvalWorkflow: Manager Approval
    provisioningSLA: 3 business days
    serviceUseCases:
      - Golden AMI pipelines
      - Compliance-hardened image baselines
      - Automated patching of server images
    serviceOnboardingRequirements:
      - Tier 2 account name
