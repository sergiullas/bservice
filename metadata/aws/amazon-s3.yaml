apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: amazon-s3
  title: Amazon S3
spec:
  type: service-offering
  profile:
    cloudProvider: AWS
    serviceCategory: Storage
    serviceDescription: >-
      Amazon S3 is a web service offered by Amazon Web Services. Amazon S3 provides storage through
      web services interfaces (REST, SOAP, and BitTorrent). Instead of organizing files in a
      traditional folder hierarchy (like a computer hard drive), S3 treats each file as an
      independent "object" stored in a flat architecture. Amazon S3 supports three types of buckets.
      The General bucket type is for general object storage.
    serviceExternalDoc: https://docs.aws.amazon.com/s3/
    serviceInternalDoc: ./platforms/development/amazon/s3
    provisioningModel: Tier 1
    cloudAto:
      - CACE
    serviceOwner: Natasha Romanoff
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-s3
    fundingApproach: ECSD pay
    approvalWorkflow: Auto-Approved
    provisioningSLA: Same day
    serviceUseCases:
      - Static website hosting
      - Data lake storage
      - Backup and archive
      - Application artifact storage
    serviceOnboardingRequirements:
      - cost-center
      - project
      - environment
      - quantity
      - bucket-name
      - actions (GetObject, PutObject, DeleteObject)
      - bucket-type (general)
