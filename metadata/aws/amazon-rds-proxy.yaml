apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: amazon-rds-proxy
  title: Amazon RDS Proxy
spec:
  type: service-offering
  profile:
    cloudProvider: AWS
    serviceCategory: Database
    serviceDescription: >-
      Amazon RDS Proxy is a fully managed database proxy designed to enhance the scalability,
      availability, and security of applications interacting with Amazon RDS databases. It achieves
      this by pooling and sharing database connections, reducing the overhead of establishing new
      connections, and improving resilience during database failovers.
    serviceExternalDoc: https://aws.amazon.com/rds/proxy/
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/platforms/development/amazon/rds.html#amazon-rds-proxy
    provisioningModel: Tier 2
    cloudAto:
      - CACE
    serviceOwner: Natasha Romanoff
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#amazon-rds-proxy
    fundingApproach: ECSD pay
    approvalWorkflow: Manager Approval
    provisioningSLA: 3 business days
    serviceUseCases:
      - Connection pooling for serverless apps
      - Improved database failover resilience
      - Reducing connection overhead at scale
