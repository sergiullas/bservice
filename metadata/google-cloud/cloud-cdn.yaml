apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: cloud-cdn
  title: Cloud CDN
spec:
  type: service-offering
  lifecycle: production
  profile:
    cloudProvider: Google Cloud
    serviceCategory: Networking
    serviceDescription: Content delivery network using Google's globally distributed edge points of presence for fast delivery.
    serviceExternalDoc: https://cloud.google.com/docs
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/
    provisioningModel: Tier 1
    cloudAto:
      - MAGE
    serviceOwner: Carol Danvers
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#cloud-cdn
    fundingApproach: ECSD pay
    approvalWorkflow: Auto-Approved
    provisioningSLA: Same day
    serviceUseCases:
      - Static web content caching
      - API response caching
      - Large file download acceleration
      - Regional latency reduction
