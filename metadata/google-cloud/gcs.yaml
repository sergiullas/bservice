apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: gcs
  title: Cloud Storage
spec:
  type: service-offering
  profile:
    cloudProvider: Google Cloud
    serviceCategory: Storage
    serviceDescription: >-
      Store unstructured data with globally consistent, durable object storage across multiple
      storage classes.
    serviceExternalDoc: https://cloud.google.com/docs
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/
    provisioningModel: Tier 1
    cloudAto:
      - MAGE
    serviceOwner: Carol Danvers
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#gcs
    fundingApproach: ECSD pay
    approvalWorkflow: Auto-Approved
    provisioningSLA: Same day
    serviceUseCases:
      - Data pipeline storage
      - ML training datasets
      - Static site hosting
      - Cross-region data replication
