apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: gce
  title: Compute Engine
spec:
  type: service-offering
  lifecycle: production
  profile:
    cloudProvider: Google Cloud
    serviceCategory: Compute
    serviceDescription: High-performance virtual machines running in Google's globally distributed data centers.
    serviceExternalDoc: https://cloud.google.com/docs
    serviceInternalDoc: https://cloud-docs.cbp.dhs.gov/
    provisioningModel: Tier 1
    cloudAto:
      - MAGE
    serviceOwner: Carol Danvers
    fedRampStatus: FedRAMP Certified
    trmStatus: Permitted
    trmLink: https://cloud-docs.cbp.dhs.gov/governance/trm.html#gce
    fundingApproach: ECSD pay
    approvalWorkflow: Auto-Approved
    provisioningSLA: Same day
    serviceUseCases:
      - General-purpose compute
      - High-performance batch jobs
      - Custom OS configurations
      - Scale-out application tiers
